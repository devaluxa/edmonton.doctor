# Add inside the edmonton.doctor server block in CloudPanel's NGINX vhost.
# Both variants go directly to the final canonical URL and preserve query strings.
location ~ ^/family-doctors-accepting-new-patients-edmonton/?$ {
  return 301 https://edmonton.doctor/family-doctor/$is_args$args;
}
location ~ ^/walk-in-clinic-edmonton/?$ {
  return 301 https://edmonton.doctor/walk-in/$is_args$args;
}
location ~ ^/patient-registration/?$ {
  return 301 https://edmonton.doctor/register/$is_args$args;
}
location ~ ^/services/walk-in-care/?$ {
  return 301 https://edmonton.doctor/walk-in/$is_args$args;
}
location ~ ^/services/family-medicine/?$ {
  return 301 https://edmonton.doctor/services/family-medicine-edmonton/$is_args$args;
}
location ~ ^/services/womens-mens-childrens-health/?$ {
  return 301 https://edmonton.doctor/services/womens-health-edmonton/$is_args$args;
}
